<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <title>离线优先应用</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div id="compat-banner" class="banner banner-error" hidden></div>

  <div id="update-banner" class="banner banner-update" hidden>
    <span>发现新版本，更新后旧缓存将被自动清理。</span>
    <button id="update-now" class="btn btn-primary">立即更新</button>
    <button id="update-later" class="btn">稍后</button>
  </div>

  <header class="app-header">
    <h1>离线优先应用</h1>
    <div class="status-row">
      <span id="net-status" class="badge badge-online">在线</span>
      <span class="badge">SW <span id="sw-version">…</span></span>
    </div>
  </header>

  <main>
    <section class="card">
      <h2>离线便签（后台同步模拟）</h2>
      <p class="hint">离线时提交的便签会存入 IndexedDB outbox，联网后由 Service Worker 自动同步。</p>
      <form id="note-form">
        <input id="note-input" type="text" placeholder="写点什么，断网试试…" autocomplete="off" required>
        <button type="submit" class="btn btn-primary">提交</button>
      </form>
      <p class="hint">待同步：<strong id="outbox-count">0</strong> 条
        <button id="btn-sync" class="btn btn-small">手动同步</button>
      </p>
      <ul id="outbox-list" class="outbox-list"></ul>
    </section>

    <section class="card">
      <h2>共享设置（多标签页同步）</h2>
      <p class="hint">在另一个标签页打开本页，修改设置会实时同步（BroadcastChannel）。</p>
      <label class="switch-row">
        <input type="checkbox" id="setting-theme"> 深色模式
      </label>
      <label class="switch-row">
        <input type="checkbox" id="setting-cache" checked> 启用运行时缓存
      </label>
    </section>

    <section class="card">
      <h2>存储配额</h2>
      <div class="storage-meter"><div id="storage-bar"></div></div>
      <p id="storage-info" class="hint">读取中…</p>
      <button id="btn-persist" class="btn btn-small">申请持久化存储</button>
      <button id="btn-reset-cache" class="btn btn-small">重建缓存</button>
    </section>
  </main>

  <div id="toasts" class="toasts"></div>

  <script src="./js/version.js"></script>
  <script src="./js/db.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
